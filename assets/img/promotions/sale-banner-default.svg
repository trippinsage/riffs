<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 900" width="700" height="900" role="img" aria-labelledby="riffsSaleDefaultTitle riffsSaleDefaultDesc">
  <title id="riffsSaleDefaultTitle">Riff's Department Store</title>
  <desc id="riffsSaleDefaultDesc">Everyday value for every home. Newfoundland &amp; Labrador's family-owned department store since 1939.</desc>

  <defs>
    <linearGradient id="riffsSaleBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C3161C"/>
      <stop offset="55%" stop-color="#EB1B21"/>
      <stop offset="100%" stop-color="#F2383E"/>
    </linearGradient>
    <radialGradient id="riffsSaleGlow" cx="50%" cy="6%" r="55%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="riffsSaleDots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.7" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>
    <path id="riffsSaleSpark" d="M0,-16 L4,-4 L16,0 L4,4 L0,16 L-4,4 L-16,0 L-4,-4 Z"/>
  </defs>

  <!-- Background -->
  <rect width="700" height="900" fill="url(#riffsSaleBg)"/>
  <rect width="700" height="900" fill="url(#riffsSaleDots)"/>
  <rect width="700" height="900" fill="url(#riffsSaleGlow)"/>

  <!-- Decorative tag motifs -->
  <g opacity="0.12" stroke="#ffffff" stroke-width="9" fill="none">
    <rect transform="translate(500,70) rotate(16)" width="150" height="150" rx="26"/>
  </g>
  <g opacity="0.10" stroke="#ffffff" stroke-width="7" fill="none">
    <rect transform="translate(55,640) rotate(-12)" width="92" height="92" rx="18"/>
  </g>

  <!-- Sparkle accents -->
  <use href="#riffsSaleSpark" x="605" y="205" fill="#FFC94B" opacity="0.85"/>
  <use href="#riffsSaleSpark" x="80" y="520" fill="#FFC94B" opacity="0.55" transform="scale(0.6)" transform-origin="80px 520px"/>
  <use href="#riffsSaleSpark" x="615" y="820" fill="#FFC94B" opacity="0.5" transform="scale(0.55)" transform-origin="615px 820px"/>
  <use href="#riffsSaleSpark" x="60" y="300" fill="#FFC94B" opacity="0.4" transform="scale(0.45)" transform-origin="60px 300px"/>

  <!-- Brand badge -->
  <g transform="translate(175,56)">
    <rect width="350" height="100" rx="50" fill="#ffffff"/>
    <text x="175" y="64" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-style="italic" font-size="44" fill="#EB1B21" letter-spacing="1">RIFF'S</text>
  </g>

  <!-- Kicker -->
  <text x="350" y="206" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="19" letter-spacing="2" fill="#FFC94B">FAMILY-OWNED &#183; NEWFOUNDLAND &amp; LABRADOR</text>

  <!-- Headline -->
  <text x="350" y="300" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="72" fill="#ffffff">EVERYDAY</text>
  <text x="350" y="382" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="72" fill="#ffffff">VALUE</text>
  <text x="350" y="424" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="28" letter-spacing="1" fill="#FFC94B">FOR EVERY HOME</text>

  <!-- Subtext -->
  <text x="350" y="474" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="500" font-size="22" fill="#ffffff" fill-opacity="0.92">Newfoundland souvenirs, apparel,</text>
  <text x="350" y="503" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="500" font-size="22" fill="#ffffff" fill-opacity="0.92">clothing &amp; home goods.</text>

  <!-- Heritage stamp -->
  <circle cx="350" cy="660" r="128" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.55" stroke-width="3"/>
  <circle cx="350" cy="660" r="110" fill="none" stroke="#FFC94B" stroke-opacity="0.65" stroke-width="2" stroke-dasharray="4 7"/>
  <text x="350" y="630" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="20" letter-spacing="2" fill="#FFC94B">EST.</text>
  <text x="350" y="690" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="58" fill="#ffffff">1939</text>
  <text x="350" y="722" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="17" letter-spacing="2" fill="#ffffff" fill-opacity="0.85">FAMILY OWNED</text>

  <!-- Pill -->
  <g transform="translate(175,814)">
    <rect width="350" height="54" rx="27" fill="none" stroke="#ffffff" stroke-opacity="0.65" stroke-width="2"/>
    <text x="175" y="35" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="20" fill="#ffffff" letter-spacing="1">20 STORES PROVINCE-WIDE</text>
  </g>

  <!-- Bottom accent -->
  <rect x="0" y="886" width="700" height="14" fill="#FFC94B"/>
</svg>
